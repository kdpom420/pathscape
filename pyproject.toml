[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT"
license-files = ["LICENSE"]
name = "pathscape"
version = "0.1.1"
description = "Phase-conditioned path landscapes and signed rarity-weighted vectors"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
nasa = ["requests>=2.28"]
test = ["pytest>=7", "requests>=2.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests requiring NASA POWER access"]
